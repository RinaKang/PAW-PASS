spring:
  application:
    name: pawpass

  datasource:
    url: jdbc:mysql://localhost:3306/pawpass?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    property-naming-strategy: SNAKE_CASE

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# 프로필 이미지 등 사용자 업로드 파일을 저장할 로컬 디스크 경로(2026-09-15 추가) - 서버가 재배포/이전되면
# 이 경로에 쌓인 파일도 같이 사라지므로, 나중에 배포 환경이 바뀌면(예: 컨테이너 재시작마다 초기화되는 환경)
# 클라우드 스토리지로 옮기는 걸 재검토해야 함(사용자와 이미 논의: 지금은 로컬 디스크로 결정, 2026-09-15).
file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}

# 업로드된 파일의 공개 URL을 만들 때 쓰는 이 서버 자신의 base URL. 요청(request)에서 유추하지 않고
# 명시적으로 고정하는 이유: 리버스 프록시 뒤에 있으면 X-Forwarded-* 헤더 설정을 안 믿을 수 있어서
# 이렇게 명시하는 쪽이 더 안전함.
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

# 외부 API 설정 - 절대 여기에 실제 키 값을 넣지 말 것!
external-api:
  tour-api:
    base-url: https://apis.data.go.kr/B551011/KorPetTourService2
    service-key: ${TOUR_API_SERVICE_KEY:}
  kcisa-api:
    # 공공데이터포털(odcloud.kr 게이트웨이) 활용신청 기준. 데이터셋 하나당 오퍼레이션이 하나뿐이라 base-url에 전체 리소스 경로를 포함시킴
    base-url: https://api.odcloud.kr/api/15111389/v1/uddi:41944402-8249-4e45-9e9d-a52d0a7db1cc
    service-key: ${KCISA_API_SERVICE_KEY:}
  gemini-api:
    # 반려동물 동반 조건 원문(자유서술) -> 구조화 판정 AI 매칭용. 무료 티어 모델(Flash 계열) 사용 전제.
    base-url: https://generativelanguage.googleapis.com
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
  google-places:
    # KCISA 시설 대표사진용 (Places API New). 사진 이름/URL은 구글 정책상 캐싱 금지라 조회 시점마다
    # 실시간으로 다시 받아야 함 - google_place_id만 배치 동기화 시점에 pet_facilities에 저장해서 재사용.
    base-url: https://places.googleapis.com
    api-key: ${GOOGLE_PLACES_API_KEY:}

jwt:
  secret: ${JWT_SECRET:change-this-in-production-please-use-env-variable}
  access-token-expire-ms: 3600000      # 1시간
  refresh-token-expire-ms: 1209600000  # 14일

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # 프론트엔드가 구글 인가코드를 발급받을 때 사용한 콜백 URL과 정확히 일치해야 함 (구글 콘솔 등록값 기준)
    redirect-uri: ${GOOGLE_REDIRECT_URI:}

# 프론트엔드 배포/개발 URL 확정되면 교체. 콤마로 여러 origin 구분 가능
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true   # 응답 Content-Type에 charset=UTF-8을 항상 명시 (구버전 PowerShell 등에서 한글 깨짐 방지)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
